name: Deploy fresh Tari testnet board to Ubuntu
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Create a fresh testnet board and switch the live website (false tests/builds only)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hauntboard-ubuntu-testnet
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kstrycharz/hauntboard' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, hauntboard-testnet]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test and compile the contract and application in containers
        run: sh hauntboard/scripts/actions-build.sh
      - name: Publish template, create fresh board and deploy server containers
        if: inputs.deploy
        run: sh hauntboard/scripts/actions-deploy.sh
      - name: Record source and contract identity
        if: success()
        run: |
          printf 'Source commit: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Testnet website: https://payroll-levels-sensitivity-bit.trycloudflare.com/\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Save verified artifacts and public deployment receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hauntboard-testnet-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            hauntboard/template-public/hauntboard_public.wasm
            hauntboard/artifacts/public-contract-manifest.json
            hauntboard/artifacts/PUBLIC_CONTRACT_SHA256SUMS.txt
            hauntboard/artifacts/hauntboard-public-contract-0.2.0-schema4.tar.gz
            hauntboard/evidence/public-contract-engine.json
            hauntboard/evidence/esmeralda-ci-contract.json
            hauntboard/evidence/actions-contract-verification.json
            hauntboard/evidence/actions-release.json

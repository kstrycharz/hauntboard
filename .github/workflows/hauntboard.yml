name: Hauntboard chain and browser gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hauntboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  delivery_foundations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify network, relay and encrypted operational recovery
        run: docker run --rm -v "$PWD:/workspace" -w /workspace node:22.21.1-bookworm-slim@sha256:25b3eb23a00590b7499f2a2ce939322727fcce1b15fdd69754fcd09536a3ae2c node --test hauntboard/tests/delivery.test.mjs hauntboard/tests/operations-backup.test.mjs hauntboard/tests/output-ledger.test.mjs
      - name: Build application without source mount or toolchain
        run: |
          docker volume create hauntbox_rust_registry
          docker compose -f compose.yaml --profile tools run --rm node-tools sh -c 'pnpm --dir hauntboard/browser-sdk install --ignore-workspace --frozen-lockfile && pnpm --dir hauntboard/browser-sdk build'
          docker compose -f compose.localnet.yaml -f compose.hauntboard.yaml build board-build
          docker compose -f compose.localnet.yaml -f compose.hauntboard.yaml run --rm --no-deps -w /workspace/hauntboard/wallet-recovery board-build sh /workspace/hauntboard/wallet-recovery/build.sh
          docker compose -f compose.localnet.yaml -f compose.hauntboard.yaml run --rm --no-deps -w /workspace/hauntboard/transaction-identity board-build sh /workspace/hauntboard/transaction-identity/build.sh
          docker build -f infra/docker/hauntboard.Dockerfile -t hauntboard-delivery:test .
      - name: Verify non-root read-only public profile
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /companion:uid=1000,gid=1000 -v "$PWD/hauntboard/tests:/tests:ro" hauntboard-delivery:test node /tests/public-server.mjs
  proof_of_concept:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_FILE: compose.localnet.yaml:compose.hauntboard.yaml
      COMPOSE_PROJECT_NAME: hauntboard-poc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build frozen browser SDK in a container
        run: docker compose -f compose.yaml --profile tools run --rm node-tools sh -c 'pnpm --dir hauntboard/browser-sdk install --ignore-workspace --frozen-lockfile && pnpm --dir hauntboard/browser-sdk build && pnpm --dir hauntboard/browser-sdk audit --prod'
      - name: Initialize build caches
        run: |
          docker volume create hauntbox_engine_test_target
          docker volume create hauntbox_rust_registry
      - name: Build pinned tools and chain runtime
        run: docker compose build validator board-engine board-build board-bootstrap
      - name: Verify native contract behavior and capacity
        run: docker compose run --rm --no-deps board-engine
      - name: Build deployable contract
        run: docker compose run --rm --no-deps board-build
      - name: Build pinned native wallet recovery adapter
        run: docker compose run --rm --no-deps -w /workspace/hauntboard/wallet-recovery board-build sh /workspace/hauntboard/wallet-recovery/build.sh
      - name: Build pinned native transaction identity adapter
        run: docker compose run --rm --no-deps -w /workspace/hauntboard/transaction-identity board-build sh /workspace/hauntboard/transaction-identity/build.sh
      - name: Generate official-wallet import compatibility fixtures
        run: docker compose run --rm --no-deps -w /workspace/hauntboard/wallet-recovery board-build cargo run --locked --release --example import_vectors
      - name: Verify and build public privacy contract on engine 0.45.0
        run: |
          docker compose run --rm --no-deps board-engine sh /workspace/hauntboard/template-public/test-engine.sh
          docker compose run --rm --no-deps -w /workspace/hauntboard/template-public board-build sh -c 'cargo build --locked --release --target wasm32-unknown-unknown && cp /target/wasm32-unknown-unknown/release/hauntboard_public.wasm /workspace/hauntboard/template-public/hauntboard_public.wasm'
      - name: Start isolated chain and independent clients
        run: docker compose up -d validator indexer indexer-independent sender receiver
      - name: Verify GUI recovery, navigation and accessible layouts with simulated providers
        run: docker compose run --rm --no-deps board-tests node hauntboard/tests/gui.mjs
      - name: Bootstrap funded wallets and publish contract
        run: docker compose run --rm --no-deps board-bootstrap
      - name: Start companions
        run: docker compose up -d board-web board-local
      - name: Verify native stealth-funded public posting and recovery
        run: |
          docker compose run --rm --no-deps board-tests node hauntboard/scripts/bootstrap-public-local.mjs
          docker compose up --build -d board-privacy
          docker compose run --rm --no-deps board-tests node hauntboard/tests/native-wallet-import.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/native-wallet-create.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/wallet-balance.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/forums.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/wallet-pin.mjs
          docker compose run --rm --no-deps -e RECOVERY_ORIGIN=http://localhost:8283 board-tests node hauntboard/tests/wallet-replace.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/poster-privacy.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/public-wallet.mjs
          docker compose run --rm --no-deps -e BROWSER=firefox board-tests node hauntboard/tests/public-wallet.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/seed-wallet.mjs
          docker compose run --rm --no-deps -e BROWSER=firefox board-tests node hauntboard/tests/seed-wallet.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/faucet-wallet.mjs
          docker compose run --rm --no-deps -e BROWSER=firefox board-tests node hauntboard/tests/faucet-wallet.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/faucet-disabled.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/mobile.mjs
          docker compose run --rm --no-deps -e MOBILE=1 board-tests node hauntboard/tests/public-wallet.mjs
          docker compose run --rm --no-deps -e MOBILE=1 -e BROWSER=firefox board-tests node hauntboard/tests/public-wallet.mjs
      - name: Verify clean end-user start and browser reset
        run: |
          docker compose run --rm --no-deps board-bootstrap node hauntboard/scripts/prepare-browser-reset.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/fresh-start.mjs
      - name: Verify public and sealed posts and native private tips
        run: docker compose run --rm --no-deps board-tests
      - name: Verify browser-owned faucet account, signatures and recovery
        run: |
          docker compose run --rm --no-deps board-tests node hauntboard/tests/browser-wallet.mjs
          docker compose run --rm --no-deps -e BROWSER=firefox board-tests node hauntboard/tests/browser-wallet.mjs
          docker compose run --rm --no-deps board-tests node hauntboard/tests/wallet-hardening.mjs
          docker compose run --rm --no-deps -e BROWSER=firefox board-tests node hauntboard/tests/wallet-hardening.mjs
      - name: Verify About navigation, contract locators and offline explanation
        run: docker compose run --rm --no-deps board-tests node hauntboard/tests/about.mjs
      - name: Verify public and sealed page rollover with both wallet paths
        run: docker compose run --rm --no-deps board-tests node hauntboard/tests/paging.mjs
      - name: Verify concurrent secret key storage
        run: docker compose run --rm --no-deps board-tests node hauntboard/tests/key-concurrency.mjs
      - name: Demonstrate primary service outage
        run: |
          docker compose stop board-web indexer sender
          docker compose run --rm --no-deps board-tests node hauntboard/tests/outage.mjs
      - name: Restore primary and verify transaction recovery
        run: |
          docker compose start board-web indexer sender
          docker compose run --rm --no-deps board-tests node hauntboard/tests/recovery.mjs
      - name: Record source and build identity
        run: |
          docker image inspect --format '{"id":{{json .Id}},"tags":{{json .RepoTags}},"digests":{{json .RepoDigests}}}' hauntbox-localnet:0.43.0 hauntbox-room-engine:latest hauntbox-room-build:latest hauntbox-localtest-v2-integration:latest > hauntboard/evidence/toolchain-images.jsonl
          docker compose run --rm --no-deps board-bootstrap node hauntboard/scripts/collect-build.mjs
      - name: Package local release
        run: docker compose -f compose.yaml --profile tools run --rm node-tools sh -c 'node hauntboard/scripts/package-release.mjs && node hauntboard/scripts/verify-release.mjs'
      - name: Keep sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hauntboard-proof
          path: |
            hauntboard/evidence/
            hauntboard/template/hauntboard.wasm
            hauntboard/web/
            hauntboard/lib/
            hauntboard/server.mjs
            hauntboard/artifacts/
            !hauntboard/evidence/failure*.png
          retention-days: 14
      - name: Stop isolated services
        if: always()
        run: docker compose down

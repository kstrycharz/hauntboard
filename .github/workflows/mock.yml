name: Application quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local_network:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build isolated local wallet tests
        run: docker compose -f compose.localnet.yaml build integration
      - name: Start validator, indexer and authenticated wallets
        run: docker compose -f compose.localnet.yaml up --build -d validator indexer sender receiver
      - name: Verify local network and native resource
        run: docker compose -f compose.localnet.yaml run --rm --no-deps probe
      - name: Bootstrap faucet funding and verify one-shot funding jobs
        run: docker compose -f compose.localnet.yaml run --rm --no-deps integration
      - name: Concealed transfer, memo scanning and independent receiver spend
        run: docker compose -f compose.localnet.yaml run --rm --no-deps integration node scripts/test-local-private-transfer.mjs
      - name: Restart persistent chain and wallets
        run: docker compose -f compose.localnet.yaml restart validator indexer sender receiver
      - name: Verify readiness and recover the same private transactions
        run: |
          docker compose -f compose.localnet.yaml run --rm --no-deps probe
          docker compose -f compose.localnet.yaml run --rm --no-deps integration node scripts/test-local-private-transfer.mjs
      - name: Build original room template
        run: docker compose --profile tools run --rm room-build
      - name: Publish original receipt through native wallet UI
        run: docker compose -f compose.localnet.yaml run --rm --no-deps integration node scripts/test-local-receipt-publication.mjs
      - name: Publish application room through native wallet UI
        run: docker compose -f compose.localnet.yaml run --rm --no-deps -e PUBLISH_HAUNTBOX_ROOM=true integration node scripts/test-local-receipt-publication.mjs
      - name: Start full application with renewable local wallet sessions
        run: docker compose -f compose.app.yaml -f compose.app.localnet.yaml -f compose.app.auth.yaml up --build --wait --wait-timeout 120 wallet-auth api worker web
      - name: PostgreSQL API and durable worker tests
        run: docker compose -f compose.app.yaml run --rm tests
      - name: Real encrypted submission, receipt and native private reward
        run: docker compose -f compose.app.yaml -f compose.app.localnet.yaml -f compose.app.browser.yaml run --build --rm --no-deps browser-tests
      - name: Frontend PIN and passkey sign-in with role separation
        run: docker compose -f compose.app.yaml -f compose.app.localnet.yaml -f compose.app.browser.yaml run --rm --no-deps browser-tests node --experimental-strip-types scripts/test-participant-sign-in.mjs
      - name: Browser wallet keypad, encrypted storage and clean-device recovery
        run: docker compose -f compose.app.yaml -f compose.app.localnet.yaml -f compose.app.browser.yaml run --rm --no-deps browser-tests node scripts/test-embedded-wallet.mjs
      - name: Restart application and verify no transaction resubmission
        run: |
          docker compose -f compose.app.yaml -f compose.app.localnet.yaml -f compose.app.auth.yaml restart api worker
          docker compose -f compose.app.yaml -f compose.app.localnet.yaml -f compose.app.browser.yaml run --rm --no-deps browser-tests
      - name: Encrypted database backup and isolated restore
        env:
          RECOVERY_SOURCE_NETWORK: hauntbox-app_application
          RECOVERY_SOURCE_SECRETS: hauntbox-app_app_secrets
          RECOVERY_SOURCE_PASSWORD: local-development-only
        run: docker compose -f compose.recovery.yaml run --build --rm drill
      - name: Stop recovery containers
        if: always()
        run: docker compose -f compose.recovery.yaml down
      - name: Stop application containers
        if: always()
        run: docker compose -f compose.app.yaml -f compose.app.localnet.yaml -f compose.app.auth.yaml down
      - name: Stop local test containers
        if: always()
        run: docker compose -f compose.localnet.yaml down
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Faucet-funded engine and receipt tests
        run: docker compose --profile engine run --rm engine-tests
      - name: Application room authority, capacity, deadline and immutability tests
        run: docker compose --profile engine run --rm room-engine
      - name: Stop engine containers
        if: always()
        run: docker compose --profile engine down
  mock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Frozen install, style, types, unit tests, production build and dependency audit
        run: docker compose --profile tools run --rm node-tools sh -c 'pnpm install --frozen-lockfile && pnpm format:check && pnpm check && pnpm test && pnpm build && pnpm audit --prod'
      - name: Chromium and Firefox acceptance
        run: docker compose --profile test run --rm e2e
      - name: Non-root preview image build
        run: docker compose --profile preview build web-preview
      - name: Stop containers and retain volumes
        if: always()
        run: docker compose down

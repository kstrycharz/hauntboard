services:
  wallet-auth:
    build: { context: ., dockerfile: infra/docker/local-tests.Dockerfile }
    working_dir: /workspace
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      - .:/workspace:ro
      - app_modules:/workspace/node_modules:ro
      - hauntbox_local_jobs:/private
      - local_network_state:/network:ro
    networks: [localtest]
    command: [node, scripts/local-app-wallet-session.mjs]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs');process.exit(fs.existsSync('/private/app-wallet-settings.json')&&Date.now()-fs.statSync('/private/receiver-token').mtimeMs<540000?0:1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    depends_on:
      wallet-auth: { condition: service_healthy }
  worker:
    depends_on:
      wallet-auth: { condition: service_healthy }
volumes:
  local_network_state: { external: true, name: hauntbox-localtest_network_state }

name: hauntbox-app
x-app: &app
  build:
    context: .
    dockerfile: infra/docker/node.Dockerfile
    target: tools
  working_dir: /workspace
  volumes:
    - .:/workspace
    - app_modules:/workspace/node_modules
    - app_web_modules:/workspace/apps/web/node_modules
    - app_secrets:/run/hauntbox:ro
  environment: &app-env
    DATABASE_URL: postgres://hauntbox:local-development-only@database:5432/hauntbox
    APP_ORIGIN: http://localhost:5173
    APP_NETWORK: localnet
    INTENT_KEY_FILE: /run/hauntbox/intent-key
    BOOTSTRAP_CODE_FILE: /run/hauntbox/bootstrap-code
    SUBMISSIONS_ENABLED: 'true'
    ANCHORING_ENABLED: 'true'
    PAYOUTS_ENABLED: 'false'
  networks: [application]
services:
  init:
    <<: *app
    volumes:
      - .:/workspace
      - app_modules:/workspace/node_modules
      - app_web_modules:/workspace/apps/web/node_modules
      - app_secrets:/run/hauntbox
    command: sh -c 'pnpm install --frozen-lockfile && node scripts/init-app-secrets.mjs'
  database:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: hauntbox
      POSTGRES_USER: hauntbox
      POSTGRES_PASSWORD: local-development-only
    volumes: [app_database:/var/lib/postgresql/data]
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hauntbox -d hauntbox']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    command: [node, --experimental-strip-types, apps/api/main.mjs]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      init: { condition: service_completed_successfully }
      database: { condition: service_healthy }
  web:
    <<: *app
    environment:
      <<: *app-env
      API_PROXY_URL: http://api:3000
      CHOKIDAR_USEPOLLING: 'true'
    command: [pnpm, dev]
    ports: ['127.0.0.1:5173:5173']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }
  tests:
    <<: *app
    profiles: [test]
    command: [sh, -c, 'node --experimental-strip-types --test tests/api/*.test.mjs']
    depends_on:
      init: { condition: service_completed_successfully }
      database: { condition: service_healthy }
networks:
  application:
volumes:
  app_database:
  app_modules:
  app_web_modules:
  app_secrets:

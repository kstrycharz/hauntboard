# Disposable, unfunded authentication experiment. Never use this virtual passkey for funds.
services:
  auth-wallet:
    extends:
      file: compose.spike.yaml
      service: sender
    volumes: !override ['sender_unlock:/run/hauntbox:ro']
    tmpfs: !override ['/tmp', '/wallet:uid=10001,gid=10001,mode=0700']
    command:
      [
        '--network',
        'esme',
        '--base-path',
        '/wallet',
        '--config',
        '/run/hauntbox/wallet.toml',
        '--indexer-api-url',
        'https://ootle-indexer-a.tari.com/',
        '--listen-on',
        '0.0.0.0:5100',
        '--auth',
        'webauthn',
      ]
  auth-probe:
    extends:
      file: compose.yaml
      service: e2e
    profiles: []
    networks: [probe]
    command: sh -c 'pnpm install --frozen-lockfile && node scripts/probe-wallet-auth.mjs'

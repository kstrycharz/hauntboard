# Independent local client for the same published manifest. Requires public compatibility gates.
name: hauntboard-client
services:
  client:
    image: ${APP_IMAGE:?Set the reviewed Hauntboard image digest}
    ports: ['127.0.0.1:8282:8280']
    environment:
      HAUNTBOARD_PROFILE: client
      HAUNTBOARD_FAUCET_ENABLED: ${HAUNTBOARD_FAUCET_ENABLED:-false}
      ORIGIN: http://localhost:8282
      PORT: '8280'
      INDEXER_URL: ${INDEPENDENT_INDEXER_URL:?Set an independently operated compatible provider}
      APPROVED_PROVIDER_ORIGINS: ${INDEPENDENT_INDEXER_URL}
      CONFIG_FILE: /run/hauntboard/network.json
    volumes:
      - ./hauntboard/deploy/network.json:/run/hauntboard/network.json:ro
      - client_operations:/companion
    read_only: true
    tmpfs: ['/tmp:size=16m,noexec,nosuid']
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
volumes:
  client_operations:

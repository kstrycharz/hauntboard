name: hauntboard-beta
services:
  edge:
    image: ${EDGE_IMAGE:?Set a reviewed Caddy image with sha256 digest}
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN:?Set the DNS name}
    volumes:
      - ./hauntboard/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    networks: [front, upstream]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    cpus: 0.5
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    depends_on:
      app: {condition: service_healthy}
  app:
    image: ${APP_IMAGE:?Set a built Hauntboard image with sha256 digest}
    environment:
      HAUNTBOARD_PROFILE: public
      HAUNTBOARD_FAUCET_ENABLED: ${HAUNTBOARD_FAUCET_ENABLED:-false}
      PORT: '8280'
      ORIGIN: https://${DOMAIN}
      INDEXER_URL: ${INDEXER_URL:?Set the compatible provider}
      APPROVED_PROVIDER_ORIGINS: ${APPROVED_PROVIDER_ORIGINS:?Set explicit approved HTTPS origins}
      CONFIG_FILE: /run/hauntboard/network.json
    volumes:
      - ./hauntboard/deploy/network.json:/run/hauntboard/network.json:ro
      - operations:/companion
    networks: [front, upstream]
    read_only: true
    tmpfs: ['/tmp:size=16m,noexec,nosuid']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.5
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:8280/health/ready',{headers:{Host:new URL(process.env.ORIGIN).host}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
networks:
  front: {internal: true}
  upstream: {}
volumes:
  operations:
  tls_data:
  tls_config:

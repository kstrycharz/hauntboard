# Optional personal wallet companion. Run on the participant's own computer.
# Never use a shared hosted instance as a participant-owned wallet.
name: hauntbox-participant
services:
  init:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, target: tools }
    command: [node, scripts/init-participant-wallet.mjs]
    volumes: ['.:/workspace:ro', participant_unlock:/unlock, participant_data:/wallet]
    network_mode: none
  wallet:
    image: hauntbox-beta-wallet:0.43.0-candidate
    build: { context: ., dockerfile: infra/docker/wallet.Dockerfile }
    command:
      [
        --network,
        esme,
        --base-path,
        /wallet,
        --config,
        /run/hauntbox/wallet.toml,
        --indexer-api-url,
        'https://ootle-indexer-a.tari.com/',
        --auth,
        webauthn,
      ]
    environment: { JRPC_LISTEN_ON: '0.0.0.0:5103' }
    ports: ['127.0.0.1:5103:5103']
    volumes: [participant_data:/wallet, 'participant_unlock:/run/hauntbox:ro']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: { driver: none }
    depends_on:
      init: { condition: service_completed_successfully }
volumes:
  participant_data:
  participant_unlock:

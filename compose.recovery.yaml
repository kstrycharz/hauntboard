name: hauntbox-recovery
services:
  init:
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, target: tools }
    volumes:
      - .:/workspace:ro
      - backup_keys:/backup-keys
      - backup_data:/backups
    network_mode: none
    command: [node, scripts/init-backup-secrets.mjs]
  restore-database:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: hauntbox_restore
      POSTGRES_USER: hauntbox
      POSTGRES_PASSWORD_FILE: /backup-keys/restore-password
    volumes:
      - restore_database:/var/lib/postgresql/data
      - backup_keys:/backup-keys:ro
    networks: [restore]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hauntbox -d hauntbox_restore']
      interval: 3s
      timeout: 3s
      retries: 20
  drill:
    build: { context: ., dockerfile: infra/docker/app.Dockerfile, target: maintenance }
    image: hauntbox-maintenance:0.2.0
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=32m,mode=1777']
    environment:
      SOURCE_HOST: database
      SOURCE_PASSWORD: '${RECOVERY_SOURCE_PASSWORD:-}'
    volumes:
      - source_secrets:/source:ro
      - backup_keys:/backup-keys:ro
      - backup_data:/backups
    networks: [source, restore]
    command: [drill]
    depends_on:
      restore-database: { condition: service_healthy }
networks:
  source: { external: true, name: '${RECOVERY_SOURCE_NETWORK:-hauntbox-production_application}' }
  restore: { internal: true }
volumes:
  source_secrets:
    { external: true, name: '${RECOVERY_SOURCE_SECRETS:-hauntbox-production_production_secrets}' }
  backup_keys:
  backup_data:
  restore_database:

name: hauntboard
services:
  app:
    image: ${APP_IMAGE:?Set immutable release image}
    environment:
      HAUNTBOARD_PROFILE: public
      HAUNTBOARD_TESTNET_BETA: 'true'
      HAUNTBOARD_FAUCET_ENABLED: ${HAUNTBOARD_FAUCET_ENABLED:-false}
      PORT: '8280'
      ORIGIN: https://hauntboard.taritracker.com
      INDEXER_URL: https://ootle-indexer-a.tari.com
      APPROVED_PROVIDER_ORIGINS: https://ootle-indexer-a.tari.com,https://ootle-indexer-b.tari.com
      CONFIG_FILE: /run/hauntboard/network.json
    volumes:
      - ./network.json:/run/hauntboard/network.json:ro
      - operations:/companion
    read_only: true
    tmpfs: ['/tmp:size=16m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:8280/health/ready',{headers:{Host:'hauntboard.taritracker.com'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  edge:
    image: ${EDGE_IMAGE:?Set pinned Caddy image}
    ports: ['80:80']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro']
    depends_on:
      app: {condition: service_healthy}
    read_only: true
    tmpfs: ['/data', '/config']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
volumes:
  operations:

name: hauntbox
x-node: &node
  build:
    context: .
    dockerfile: infra/docker/node.Dockerfile
    target: tools
  working_dir: /workspace
  volumes:
    - .:/workspace
    - root_modules:/workspace/node_modules
    - web_modules:/workspace/apps/web/node_modules
    - pnpm_store:/pnpm/store
services:
  web-dev:
    <<: *node
    profiles: [mock, test]
    command: sh -c 'pnpm install --frozen-lockfile && pnpm dev'
    ports: ['127.0.0.1:5173:5173']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20
    environment:
      CHOKIDAR_USEPOLLING: 'true'
  node-tools:
    <<: *node
    profiles: [tools]
  rust-spike:
    profiles: [tools]
    build:
      context: .
      dockerfile: infra/docker/rust-spike.Dockerfile
    volumes:
      - .:/workspace
      - rust_spike_target:/target
      - rust_registry:/usr/local/cargo/registry
    command: cargo build --locked --release --target wasm32-unknown-unknown
  engine-tests:
    profiles: [engine]
    build:
      context: .
      dockerfile: infra/docker/rust-spike.Dockerfile
    volumes:
      - .:/workspace
      - engine_test_target:/target
      - rust_registry:/usr/local/cargo/registry
    command: cargo test --locked --test engine -- --test-threads=1
  web-preview:
    profiles: [preview]
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      target: preview
    ports: ['127.0.0.1:4173:4173']
  e2e:
    profiles: [test]
    build:
      context: .
      dockerfile: infra/docker/browser.Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - root_modules:/workspace/node_modules
      - web_modules:/workspace/apps/web/node_modules
      - pnpm_store:/pnpm/store
    command: sh -c 'pnpm install --frozen-lockfile && pnpm test:e2e'
    shm_size: 1gb
volumes:
  root_modules:
  web_modules:
  pnpm_store:
  rust_spike_target:
  rust_registry:
  engine_test_target:

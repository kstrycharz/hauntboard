name: hauntboard-tunnel
services:
  app:
    image: ${APP_IMAGE:?Set the reviewed imported image ID}
    pull_policy: never
    environment:
      HAUNTBOARD_PROFILE: public
      HAUNTBOARD_FAUCET_ENABLED: ${HAUNTBOARD_FAUCET_ENABLED:-false}
      HAUNTBOARD_TESTNET_BETA: ${HAUNTBOARD_TESTNET_BETA:-false}
      PORT: '8280'
      ORIGIN: ${ORIGIN:?Set the tunnel HTTPS origin}
      INDEXER_URL: https://ootle-indexer-a.tari.com
      APPROVED_PROVIDER_ORIGINS: https://ootle-indexer-a.tari.com,https://ootle-indexer-b.tari.com
      CONFIG_FILE: /run/hauntboard/network.json
    volumes:
      - ./network.json:/run/hauntboard/network.json:ro
      - operations:/companion
    networks: [front, upstream]
    read_only: true
    tmpfs: ['/tmp:size=16m,noexec,nosuid']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.5
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:8280/health/ready',{headers:{Host:new URL(process.env.ORIGIN).host}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  tunnel:
    image: cloudflare/cloudflared@sha256:21f3607baf2384c54d592b0efe76dd5f548c0dbc083e62fa22c7fac3923d077f
    command: [tunnel, --no-autoupdate, --protocol, http2, --url, 'http://app:8280']
    networks: [front, upstream]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
networks:
  front: {internal: true}
  upstream: {}
volumes:
  operations:

[package]
name = "hauntboard_public"
version = "0.2.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
tari_template_lib = "=0.37.0"
[dev-dependencies]
tari_template_test_tooling = "=0.49.1"
[profile.dev]
debug = 0
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

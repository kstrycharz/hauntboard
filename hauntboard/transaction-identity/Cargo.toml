[package]
name = "hauntboard_transaction_identity"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
tari_ootle_transaction = { version = "=0.49.1", features = ["serde"] }
tari_bor = "=0.16.6"
getrandom_02 = { package = "getrandom", version = "=0.2.17", features = ["custom"] }
tari_engine_types = "=0.49.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
prost = "=0.14.4"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

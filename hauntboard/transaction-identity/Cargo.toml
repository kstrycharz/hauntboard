[package]
name = "hauntboard_transaction_identity"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
tari_ootle_transaction = "=0.43.0"
tari_bor = "=0.16.2"

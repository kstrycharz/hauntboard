[package]
name = "hauntboard_wallet_recovery"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib"]

[dependencies]
tari_ootle_wallet_crypto = "=0.45.0"
tari_common_types = "=6.0.1"
tari_hashing = "=6.0.1"
tari_engine_types = "=0.43.0"
tari_template_lib_types = "=0.33.0"
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
crc32fast = "=1.5.0"
tari_utilities = "=0.10.0"
zeroize = "=1.9.1"
getrandom_02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
serde_json = "=1.0.151"


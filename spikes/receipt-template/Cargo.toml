[package]
name = "hauntbox-receipt-spike"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tari_template_lib = "=0.33.0"

[dev-dependencies]
tari_template_test_tooling = "=0.43.0"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
